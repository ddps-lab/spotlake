# SpotLake 관련 논문 목록.
#
# About 페이지의 Related Work 항목이 이 파일 하나만 읽는다. 논문을
# 추가하거나 고치거나 지우려면 여기만 손대면 되고, 코드는 건드릴 필요가
# 없다. 연도별 묶음과 정렬은 화면이 알아서 한다.
#
# 두 갈래로 나뉜다.
#   ddps      SpotLake 를 활용한 DDPS Lab 연구
#   citing    SpotLake 를 인용한 외부 연구
#
# SpotLake 원 논문은 여기에 넣지 않는다. Related Work 가 아니라 대상 자체이고,
# About 페이지 위쪽 Paper and code 항목에서 이미 제공하고 있다.
#
# 항목 하나는 이렇게 쓴다. title 만 있으면 나머지는 없어도 된다.
#
#   - title:   논문 제목
#     authors: 저자를 쓰인 순서대로, 쉼표로 구분
#     venue:   학회나 저널 이름
#     year:    연도 (숫자). 없으면 목록 맨 뒤로 간다
#     links:
#       - { name: PDF, url: "..." }
#
# links 의 name 은 화면에 그대로(대문자로) 나온다. PDF, IEEE, ACM, ARXIV,
# BIB, GITHUB, DEMO, SPRINGER, DOI 처럼 짧게 쓴다. 링크가 없으면 links
# 자체를 빼도 된다.
#
# 제목에 콜론(:)이 들어가면 YAML 이 헷갈리므로 따옴표로 감싼다.
#   - title: "SpotGATES: DRL for Workflow Scheduling"

